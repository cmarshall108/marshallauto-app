name: MarshallAuto
options:
  bundleIdPrefix: com.marshallautosanford
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MarshallAuto:
    type: application
    platform: iOS
    sources:
      - MarshallAuto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marshallautosanford.admin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Marshall Auto Admin
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
